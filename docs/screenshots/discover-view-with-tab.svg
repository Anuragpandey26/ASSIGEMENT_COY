<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 840" width="100%" height="100%" style="background:#ffffff;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="460" height="70" fill="#ffffff" stroke="#f0f0f0" stroke-width="1"/>
  
  <!-- Coy Wordmark with Pink Dot -->
  <text x="24" y="45" font-size="28" font-weight="900" fill="#000000" letter-spacing="-1">coy<tspan fill="#FF3864">.</tspan></text>
  
  <!-- Header Navigation Tabs -->
  <!-- Home Tab -->
  <g transform="translate(140, 20)">
    <rect width="52" height="30" rx="15" fill="#f4f4f5"/>
    <text x="26" y="20" font-size="12" font-weight="700" fill="#52525b" text-anchor="middle">Home</text>
  </g>

  <!-- Discover Tab (ACTIVE HIGHLIGHT) -->
  <g transform="translate(200, 20)">
    <rect width="84" height="30" rx="15" fill="#FF3864" stroke="#000000" stroke-width="1.5"/>
    <!-- Compass Icon -->
    <circle cx="16" cy="15" r="7" fill="none" stroke="#000000" stroke-width="1.5"/>
    <polygon points="16,10 18,15 16,20 14,15" fill="#000000"/>
    <text x="50" y="20" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">Discover</text>
  </g>

  <!-- Matches Tab -->
  <g transform="translate(292, 20)">
    <rect width="66" height="30" rx="15" fill="#f4f4f5"/>
    <text x="33" y="20" font-size="12" font-weight="700" fill="#52525b" text-anchor="middle">Matches</text>
  </g>

  <!-- Status Bar -->
  <g transform="translate(30, 86)">
    <!-- 100% Anonymous Badge -->
    <rect width="130" height="26" rx="13" fill="#FFF066" stroke="#000000" stroke-width="1"/>
    <text x="14" y="17" font-size="11">🔒</text>
    <text x="32" y="17" font-size="11" font-weight="800" fill="#000000">100% anonymous</text>
  </g>

  <!-- Discovery Card Shadow -->
  <rect x="34" y="128" width="396" height="520" rx="20" fill="#000000"/>

  <!-- Discovery Card Background -->
  <rect x="30" y="124" width="396" height="520" rx="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <!-- Profile Image -->
  <defs>
    <clipPath id="cardImageClip">
      <rect x="30" y="124" width="396" height="310" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#cardImageClip)">
    <image href="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&amp;fit=crop&amp;w=800&amp;q=80" x="30" y="124" width="396" height="310" preserveAspectRatio="xMidYMid slice"/>
    <line x1="30" y1="434" x2="426" y2="434" stroke="#000000" stroke-width="2"/>
    
    <!-- Location Pill on photo -->
    <g transform="translate(46, 394)">
      <rect width="70" height="26" rx="13" fill="#FFF066" stroke="#000000" stroke-width="1"/>
      <circle cx="16" cy="13" r="3.5" fill="none" stroke="#000000" stroke-width="1.5"/>
      <text x="26" y="17" font-size="11" font-weight="800" fill="#000000">Milan</text>
    </g>
  </g>

  <!-- Profile Details -->
  <g transform="translate(50, 470)">
    <!-- Name and Age -->
    <text x="0" y="0" font-size="24" font-weight="900" fill="#000000" letter-spacing="-0.5">Lucas Rossi, <tspan fill="#6b7280" font-weight="700">28</tspan></text>
    
    <!-- Bio -->
    <text x="0" y="26" font-size="13" font-weight="500" fill="#374151">Specialty coffee roaster and road cyclist.</text>
    <text x="0" y="44" font-size="13" font-weight="500" fill="#374151">Looking for good brunch companions.</text>

    <!-- Interest Tags -->
    <g transform="translate(0, 68)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="62" height="24" rx="12" fill="#E2D9FC" stroke="#000000" stroke-width="1"/>
      <text x="31" y="16" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">Coffee</text>

      <!-- Tag 2 -->
      <rect x="70" y="0" width="65" height="24" rx="12" fill="#FFDECE" stroke="#000000" stroke-width="1"/>
      <text x="102" y="16" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">Cycling</text>

      <!-- Tag 3 -->
      <rect x="143" y="0" width="92" height="24" rx="12" fill="#D2F6DE" stroke="#000000" stroke-width="1"/>
      <text x="189" y="16" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">Gastronomy</text>

      <!-- Tag 4 -->
      <rect x="243" y="0" width="64" height="24" rx="12" fill="#FFDCE5" stroke="#000000" stroke-width="1"/>
      <text x="275" y="16" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">Design</text>
    </g>
  </g>

  <!-- Controls Area -->
  <g transform="translate(0, 680)">
    <!-- Pass Button Shadow & Button -->
    <circle cx="180" cy="40" r="30" fill="#000000"/>
    <circle cx="178" cy="38" r="30" fill="#FFDECE" stroke="#000000" stroke-width="2"/>
    <path d="M168,28 L188,48 M188,28 L168,48" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

    <!-- Like Button Shadow & Button -->
    <circle cx="282" cy="40" r="30" fill="#000000"/>
    <circle cx="280" cy="38" r="30" fill="#FF3864" stroke="#000000" stroke-width="2"/>
    <path d="M280,33 C276,27 268,29 268,36 C268,44 280,51 280,51 C280,51 292,44 292,36 C292,29 284,27 280,33 Z" fill="#000000"/>

    <!-- Keyboard Hint -->
    <text x="230" y="88" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">Press ← to Pass, → to Like</text>
  </g>
</svg>
