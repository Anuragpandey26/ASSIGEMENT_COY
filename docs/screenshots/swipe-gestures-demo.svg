<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%" style="background:#ffffff;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Section Title -->
  <text x="440" y="36" font-size="20" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-0.5">Gesture Dynamics — Left Drag (PASS) &amp; Right Drag (LIKE)</text>

  <!-- Left: PASS Gesture -->
  <g transform="translate(40, 60)">
    <!-- Card Frame (Rotated left) -->
    <g transform="rotate(-8 180 180)">
      <rect x="14" y="14" width="340" height="300" rx="18" fill="#000000"/>
      <rect x="10" y="10" width="340" height="300" rx="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      
      <!-- Photo Area -->
      <defs>
        <clipPath id="passClip">
          <rect x="10" y="10" width="340" height="180" rx="18"/>
        </clipPath>
      </defs>
      <image href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=600&amp;q=80" x="10" y="10" width="340" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#passClip)"/>
      <line x1="10" y1="190" x2="350" y2="190" stroke="#000000" stroke-width="2"/>

      <!-- Details -->
      <text x="30" y="225" font-size="18" font-weight="900" fill="#000000">Elena Rostova, 25</text>
      <text x="30" y="248" font-size="11" font-weight="500" fill="#4b5563">Architecture photographer • London</text>

      <!-- PASS STAMP OVERLAY -->
      <g transform="translate(210, 30) rotate(14)">
        <rect width="100" height="38" rx="19" fill="#FFDECE" stroke="#000000" stroke-width="2"/>
        <text x="50" y="25" font-size="14" font-weight="900" fill="#000000" text-anchor="middle">✕ PASS</text>
      </g>
    </g>

    <!-- Label Below -->
    <text x="180" y="340" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">Swipe Left / Press ← to Pass</text>
    <text x="180" y="358" font-size="11" font-weight="500" fill="#6b7280" text-anchor="middle">Recorded permanently; never seen again</text>
  </g>

  <!-- Right: LIKE Gesture -->
  <g transform="translate(480, 60)">
    <!-- Card Frame (Rotated right) -->
    <g transform="rotate(8 180 180)">
      <rect x="14" y="14" width="340" height="300" rx="18" fill="#000000"/>
      <rect x="10" y="10" width="340" height="300" rx="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      
      <!-- Photo Area -->
      <defs>
        <clipPath id="likeClip">
          <rect x="10" y="10" width="340" height="180" rx="18"/>
        </clipPath>
      </defs>
      <image href="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&amp;fit=crop&amp;w=600&amp;q=80" x="10" y="10" width="340" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#likeClip)"/>
      <line x1="10" y1="190" x2="350" y2="190" stroke="#000000" stroke-width="2"/>

      <!-- Details -->
      <text x="30" y="225" font-size="18" font-weight="900" fill="#000000">Aarav Sharma, 26</text>
      <text x="30" y="248" font-size="11" font-weight="500" fill="#4b5563">Product designer • Delhi</text>

      <!-- LIKE STAMP OVERLAY -->
      <g transform="translate(30, 30) rotate(-14)">
        <rect width="100" height="38" rx="19" fill="#FF3864" stroke="#000000" stroke-width="2"/>
        <text x="50" y="25" font-size="14" font-weight="900" fill="#000000" text-anchor="middle">♥ LIKE</text>
      </g>
    </g>

    <!-- Label Below -->
    <text x="180" y="340" font-size="13" font-weight="800" fill="#000000" text-anchor="middle">Swipe Right / Press → to Like</text>
    <text x="180" y="358" font-size="11" font-weight="500" fill="#6b7280" text-anchor="middle">Mutual match triggers "It's a match!"</text>
  </g>
</svg>
