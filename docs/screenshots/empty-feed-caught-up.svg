<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" width="100%" height="100%" style="background:#ffffff;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="460" height="70" fill="#ffffff" stroke="#f0f0f0" stroke-width="1"/>
  <text x="24" y="45" font-size="28" font-weight="900" fill="#000000" letter-spacing="-1">coy<tspan fill="#FF3864">.</tspan></text>
  
  <g transform="translate(200, 20)">
    <rect width="84" height="30" rx="15" fill="#FF3864" stroke="#000000" stroke-width="1.5"/>
    <text x="42" y="20" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">Discover</text>
  </g>

  <!-- Empty Card -->
  <g transform="translate(45, 110)">
    <rect x="4" y="4" width="370" height="360" rx="24" fill="#000000"/>
    <rect x="0" y="0" width="370" height="360" rx="24" fill="#ffffff" stroke="#000000" stroke-width="2"/>

    <!-- Mint Checkmark Badge -->
    <circle cx="185" cy="70" r="32" fill="#D2F6DE" stroke="#000000" stroke-width="2"/>
    <path d="M173,70 L181,78 L197,62" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Heading -->
    <text x="185" y="145" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="-0.5">You're all caught up.</text>
    
    <!-- Body -->
    <text x="185" y="178" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle">There are no more profiles to discover right now.</text>
    <text x="185" y="196" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle">Matches happen only when interest is mutual!</text>

    <!-- Primary Button: View Matches -->
    <g transform="translate(45, 230)">
      <rect x="2" y="2" width="280" height="44" rx="22" fill="#000000"/>
      <rect x="0" y="0" width="280" height="44" rx="22" fill="#FF3864" stroke="#000000" stroke-width="2"/>
      <text x="140" y="27" font-size="13" font-weight="900" fill="#000000" text-anchor="middle">View your matches (3)</text>
    </g>

    <!-- Secondary Button: Reset Demo -->
    <g transform="translate(45, 290)">
      <rect x="1" y="1" width="280" height="38" rx="19" fill="#000000"/>
      <rect x="0" y="0" width="280" height="38" rx="19" fill="#FFF066" stroke="#000000" stroke-width="1.5"/>
      <text x="140" y="24" font-size="12" font-weight="800" fill="#000000" text-anchor="middle">↺ Reset demo swipes</text>
    </g>
  </g>
</svg>
